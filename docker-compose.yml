services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - WORKSPACE_DIR=/app/workspace
      - LLM_CACHE_DIR=/app/.llm_cache
    volumes:
      - ./backend/app:/app/app
      - recoup_workspace:/app/workspace
      - recoup_llm_cache:/app/.llm_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  recoup_workspace:
  recoup_llm_cache:
