<!doctype html>
<html lang="en" class="dark" data-theme-accent="emerald">
  <head>
    <meta charset="UTF-8" />

    <script>
      // Apply persisted theme before first paint (defaults to dark).
      try {
        var t = localStorage.getItem("recoup.theme");
        document.documentElement.classList.toggle("dark", t !== "light");
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
